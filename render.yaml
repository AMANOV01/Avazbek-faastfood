services:
  - type: web
    name: avazbek-lavash
    runtime: node
    plan: free
    buildCommand: cd frontend && npm install --include=dev && npm run build && cd ../backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ADMIN_PASSWORD
        sync: false
      - key: YANDEX_MAPS_KEY   # ixtiyoriy: Yandex xarita kaliti (bo'lmasa OpenStreetMap)
        sync: false
      - key: DATABASE_URL   # Neon/Supabase ulanish satri
        sync: false
